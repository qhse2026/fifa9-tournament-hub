<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#04091a">
  <title>FIFA 10 · Fikstür ve Sonuç Merkezi</title>
  <style>
    :root{--bg:#04091a;--panel:#08112d;--panel2:#111934;--line:rgba(118,151,255,.22);--text:#f7f8ff;--muted:#91a0c4;--blue:#46a9ff;--gold:#efc65f;--green:#52dfa0;--red:#ff7e91}
    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;background:radial-gradient(circle at 18% -10%,rgba(60,96,219,.21),transparent 35%),radial-gradient(circle at 90% 0,rgba(156,61,217,.16),transparent 30%),var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}button,input{font:inherit}button{cursor:pointer}
    main{width:min(1500px,100%);margin:auto;padding-bottom:60px}.topbar{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;padding:17px 24px;border-bottom:1px solid var(--line);background:rgba(4,9,26,.92);backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;border-radius:14px;overflow:hidden;background:#111c3d;font-weight:900}.brand span,.brand b{padding:13px 11px}.brand span{color:#a4b9ff}.brand b{background:linear-gradient(135deg,#3e82ff,#9c4be9)}.topbar small,.section-head small{color:#70c2ff;font-size:9px;font-weight:900;letter-spacing:.17em}.topbar h1{margin:4px 0 0;font-size:19px}.progress{text-align:right}.progress strong{display:block;font-size:25px;color:var(--gold)}.progress strong i{color:#7180a5;font-size:15px;font-style:normal}.progress span{font-size:8px;color:#8795b8;letter-spacing:.13em}.cloud-state{grid-column:1/4;display:none;padding:8px 11px;border:1px solid var(--line);border-radius:9px;color:#91a0c4;font-size:10px}.cloud-state.show{display:block}.cloud-state.ok{color:var(--green);border-color:rgba(82,223,160,.26)}.cloud-state.warn{color:var(--gold);border-color:rgba(239,198,95,.3)}
    .tabs{display:flex;gap:6px;padding:13px 24px;border-bottom:1px solid var(--line);background:rgba(5,11,29,.76);overflow:auto}.tabs button,.filters button{border:1px solid transparent;border-radius:10px;padding:11px 15px;background:transparent;color:#8290b5;font-size:10px;font-weight:900;white-space:nowrap}.tabs button.active,.filters button.active{color:white;border-color:rgba(103,144,255,.35);background:linear-gradient(90deg,rgba(53,126,255,.2),rgba(156,72,239,.2))}
    .content{padding:27px 24px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:19px}.section-head h2{font-size:clamp(25px,4vw,38px);margin:7px 0}.section-head p{margin:0;color:var(--muted);line-height:1.6}.section-head>b{font-size:27px;color:var(--gold)}.filters{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}.filters>div{display:flex;gap:5px;overflow:auto}.filters button{border-color:var(--line);padding:9px 11px}
    .fixture-list{display:grid;gap:8px}.fixture{border:1px solid var(--line);border-radius:15px;background:rgba(7,15,38,.82);overflow:hidden}.fixture.done{border-color:rgba(82,223,160,.3)}.fixture-row{display:grid;grid-template-columns:110px minmax(150px,1fr) 90px minmax(150px,1fr) 115px;align-items:center;gap:12px;width:100%;min-height:67px;padding:11px 15px;border:0;background:transparent;color:white;text-align:left}.fixture-row strong.away{text-align:right}.meta{color:#71c2ff;font-size:9px;font-weight:900}.meta small{display:block;margin-top:5px;color:#7f8eb1}.score{display:flex;justify-content:center;gap:9px;align-items:center}.score b{font-size:20px;color:var(--gold)}.score i{color:#7180a3;font-style:normal}.score em{font-size:10px;color:#78c8ff;font-style:normal}.status{text-align:right;color:#7382a6;font-size:8px;font-weight:900}.done .status{color:var(--green)}.result-editor{display:grid;grid-template-columns:1fr 30px 1fr;align-items:center;gap:14px;padding:18px;border-top:1px solid var(--line);background:rgba(17,25,52,.76)}.result-editor label{display:grid;grid-template-columns:1fr 160px 70px;align-items:center;gap:9px}.result-editor label.away-label b{text-align:right}.result-editor input{min-width:0;padding:12px;border:1px solid var(--line);border-radius:10px;background:#07112d;color:#fff}.result-editor .score-input{text-align:center;font-size:20px;font-weight:900;color:var(--gold)}.result-editor>span{text-align:center;color:var(--gold)}.result-editor footer{grid-column:1/4;display:flex;justify-content:flex-end;gap:8px}.result-editor footer button{padding:11px 15px;border-radius:10px;color:#fff;font-weight:900}.clear{border:1px solid rgba(255,126,145,.3);background:transparent;color:var(--red)!important}.save{border:0;background:linear-gradient(90deg,#347fff,#a14cf0)}.save:disabled{opacity:.4}
    .ranking-rules{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.ranking-rules span{padding:8px 10px;border:1px solid var(--line);border-radius:8px;color:#91a1c5;font-size:8px;font-weight:900}.table-scroll{overflow:auto;border:1px solid var(--line);border-radius:17px}.standings{min-width:850px}.standings>div{display:grid;grid-template-columns:45px minmax(220px,1fr) 55px repeat(5,50px) 125px;align-items:center;min-height:52px;padding:0 15px;border-bottom:1px solid rgba(118,151,255,.12);color:#9aa8ca}.standings .thead{position:sticky;top:0;background:#0a1432;font-size:8px;font-weight:900;letter-spacing:.11em;color:#7180a4}.standings strong{color:white}.standings em{font-size:15px;font-weight:900;font-style:normal;color:var(--gold)}.standings em i{font-size:11px;color:#8291b6;font-style:normal}.standings .top-four{background:linear-gradient(90deg,rgba(55,126,255,.1),rgba(155,76,240,.06))}.standings .top-four>b{color:var(--gold)}
    .group-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.group-card{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:rgba(7,15,38,.8)}.group-card header{display:grid;grid-template-columns:1fr auto;align-items:end;padding:18px;border-bottom:1px solid var(--line)}.group-card header small{font-size:8px;color:#7483a8}.group-card header strong{grid-row:1/3;grid-column:2;font-size:43px;color:var(--gold)}.group-card header b{font-size:9px;color:#75c7ff}.group-card>div{display:flex;align-items:center;gap:12px;padding:15px;border-bottom:1px solid rgba(118,151,255,.1)}.group-card i{font-style:normal;color:#66769c}.group-card span{font-weight:800}.hidden{display:none!important}
    @media(max-width:760px){.topbar{grid-template-columns:auto 1fr;padding:12px}.progress{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;text-align:left;padding-top:9px;border-top:1px solid var(--line)}.cloud-state{grid-column:1/3}.progress strong{font-size:20px}.tabs{padding:10px 12px}.content{padding:20px 11px}.section-head{display:grid}.section-head h2{font-size:27px}.section-head>b{font-size:20px}.filters{display:grid}.fixture-row{grid-template-columns:64px minmax(90px,1fr) 48px minmax(90px,1fr);gap:6px;padding:10px 8px}.fixture-row strong{font-size:10px}.fixture-row .status{grid-column:1/5;text-align:center;padding-top:7px;border-top:1px solid rgba(118,151,255,.1)}.result-editor{grid-template-columns:1fr;gap:10px;padding:13px}.result-editor>span{display:none}.result-editor label{grid-template-columns:1fr 65px}.result-editor label b{grid-column:1/3;text-align:left!important}.result-editor footer{grid-column:1}.result-editor footer button{flex:1}.group-grid{grid-template-columns:1fr}.topbar h1{font-size:15px}.brand span,.brand b{padding:10px 8px}}
  </style>
</head>
<body>
  <main>
    <header class="topbar">
      <div class="brand"><span>FIFA</span><b>10</b></div>
      <div><small>ORUÇ REİS FOOTBALL UNIVERSE</small><h1>Fikstür ve Sonuç Merkezi</h1></div>
      <div class="progress"><strong id="playedCount">0<i>/78</i></strong><span>MAÇ TAMAMLANDI</span></div>
      <div class="cloud-state show" id="cloudState">Turnuva verisi hazırlanıyor…</div>
    </header>
    <nav class="tabs">
      <button class="active" data-tab="fixtures">FİKSTÜR</button>
      <button data-tab="standings">GENEL PUAN</button>
      <button data-tab="groups">GRUPLAR</button>
    </nav>
    <section class="content" id="content"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="cloud-config.js"></script>
  <script src="cloud.js"></script>
  <script src="language.js?v=2.0.0"></script>
  <script>
  (() => {
    "use strict";
    const GROUPS = {
      A:["Kerim Özmen","Ercan Köseoğlu","Emre Çınar","Ersin Darıcı","Şafak Denar"],
      B:["Oğuzhan Dindar","Aziz Sarıoğlu","Sergei Smirnov","Affan Volkan Akbal"],
      C:["Çağlar Can Tatar","Mohd Khairull Muzammil Bin Ramly","Denar Aleksandr Shulev","Asen Sabuncu","Cihan Sezgin BOTAŞ"]
    };
    const LOCAL_KEY = "fifa10-standalone-results-v1";
    const CLOUD_KEY = "fifa10StandaloneOperations";
    let results = {};
    let state = null;
    let admin = false;
    let activeTab = "fixtures";
    let groupFilter = "ALL";
    let legFilter = 0;
    let openId = null;
    let saveTimer = null;

    const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));
    const ui = (tr, en) => window.FIFA_I18N?.language === "en" ? en : tr;
    const fixtures = [];
    Object.entries(GROUPS).forEach(([group, players]) => {
      [1,2,3].forEach(leg => {
        for(let i=0;i<players.length;i+=1) for(let j=i+1;j<players.length;j+=1) {
          const reverse = leg === 2;
          fixtures.push({id:`${group}-${leg}-${i}-${j}`,group,leg,stars:leg===1?"4★":leg===2?"4.5★":"5★",home:reverse?players[j]:players[i],away:reverse?players[i]:players[j]});
        }
      });
    });
    const completed = fixture => {
      const row=results[fixture.id];
      return Boolean(row && row.homeScore!=="" && row.awayScore!=="");
    };
    const defaultResult = () => ({homeScore:"",awayScore:"",homeTeam:"",awayTeam:""});
    const cloudBox = document.getElementById("cloudState");
    function setCloud(text,type="") { cloudBox.textContent=text; cloudBox.className=`cloud-state show ${type}`; }
    function persistLocal(){ localStorage.setItem(LOCAL_KEY,JSON.stringify(results)); }
    function scheduleCloudSave(){
      persistLocal();
      clearTimeout(saveTimer);
      saveTimer=setTimeout(saveCloud,250);
    }
    async function saveCloud(){
      if(!state || !admin || !window.FIFA_CLOUD?.save){ setCloud("Bu cihazda kaydedildi. Bulut kaydı için yönetici oturumunu açık tutun.","warn"); return; }
      const next=JSON.parse(JSON.stringify(state));
      next[CLOUD_KEY]={version:1,updatedAt:new Date().toISOString(),groups:GROUPS,results};
      state=next;
      try{ await window.FIFA_CLOUD.save(next); setCloud("Kaydedildi · PC ve telefon arasında senkronize","ok"); }
      catch(error){ console.error(error); setCloud("Bu cihazda kaydedildi; bulut senkronizasyonu bekliyor.","warn"); }
    }
    function tableRows(){
      const rows=Object.entries(GROUPS).flatMap(([group,players])=>players.map(name=>({name,group,mp:0,w:0,d:0,l:0,gf:0,ga:0,pts:0})));
      const map=new Map(rows.map(row=>[row.name,row]));
      fixtures.forEach(fixture=>{
        const result=results[fixture.id]; if(!result||result.homeScore===""||result.awayScore==="")return;
        const hs=Number(result.homeScore),as=Number(result.awayScore),home=map.get(fixture.home),away=map.get(fixture.away);
        home.mp++;away.mp++;home.gf+=hs;home.ga+=as;away.gf+=as;away.ga+=hs;
        if(hs>as){home.w++;away.l++;home.pts+=3}else if(hs<as){away.w++;home.l++;away.pts+=3}else{home.d++;away.d++;home.pts++;away.pts++}
      });
      return rows.map(row=>{const gd=row.gf-row.ga;return {...row,gd,ppg:row.mp?row.pts/row.mp:0,gdPerMatch:row.mp?gd/row.mp:0,winRate:row.mp?row.w/row.mp:0}}).sort((a,b)=>b.ppg-a.ppg||b.gdPerMatch-a.gdPerMatch||b.gf-a.gf||b.winRate-a.winRate||a.name.localeCompare(b.name,"tr"));
    }
    function render(){
      document.getElementById("playedCount").innerHTML=`${fixtures.filter(completed).length}<i>/78</i>`;
      document.querySelectorAll("[data-tab]").forEach(button=>button.classList.toggle("active",button.dataset.tab===activeTab));
      const content=document.getElementById("content");
      if(activeTab==="fixtures"){
        const visible=fixtures.filter(f=>(groupFilter==="ALL"||f.group===groupFilter)&&(!legFilter||f.leg===legFilter));
        content.innerHTML=`<div class="section-head"><div><small>TRIPLE CIRCUIT · 4★ / 4.5★ / 5★</small><h2>Maç sonuçlarını doğrudan işle.</h2><p>Maça dokun, skorları yaz ve kaydet. Genel PPG tablosu anında güncellenir.</p></div><b>${visible.filter(completed).length}/${visible.length}</b></div>
          <div class="filters"><div>${["ALL","A","B","C"].map(g=>`<button class="${groupFilter===g?"active":""}" data-group-filter="${g}">${g==="ALL"?"TÜM GRUPLAR":`GRUP ${g}`}</button>`).join("")}</div><div>${[0,1,2,3].map(leg=>`<button class="${legFilter===leg?"active":""}" data-leg-filter="${leg}">${leg?`${leg}. DEVRE`:"TÜM DEVRELER"}</button>`).join("")}</div></div>
          <div class="fixture-list">${visible.map(fixture=>renderFixture(fixture)).join("")}</div>`;
      } else if(activeTab==="standings"){
        const rows=tableRows(),played=fixtures.filter(completed).length;
        content.innerHTML=`<div class="section-head"><div><small>ONE TABLE · RATE-BASED RANKING</small><h2>FIFA 10 Genel Puan Sıralaması</h2><p>Sıralama PPG ve maç başına averajla yapılır. Toplam puan yalnızca parantez içinde bilgi amaçlı gösterilir.</p></div><b>${played}/78</b></div>
          <div class="ranking-rules"><span>1 · PPG</span><span>2 · AV/M</span><span>3 · TOPLAM AG</span><span>4 · GALİBİYET ORANI</span></div>
          <div class="table-scroll"><div class="standings"><div class="thead"><span>#</span><span>${ui("Oyuncu","Player")}</span><span>${ui("Grup","Group")}</span><span>${ui("O","MP")}</span><span>${ui("G","W")}</span><span>${ui("B","D")}</span><span>${ui("M","L")}</span><span>${ui("AV/M (AV)","GD/M (GD)")}</span><span>${ui("PPG (P)","PPG (Pts)")}</span></div>${rows.map((row,index)=>`<div class="${index<4?"top-four":""}"><b>${index+1}</b><strong>${esc(row.name)}</strong><span>${row.group}</span><span>${row.mp}</span><span>${row.w}</span><span>${row.d}</span><span>${row.l}</span><span>${row.gdPerMatch>0?"+":""}${row.gdPerMatch.toFixed(3)} (${row.gd>0?"+":""}${row.gd})</span><em>${row.ppg.toFixed(3)} <i>(${row.pts})</i></em></div>`).join("")}</div></div>`;
      } else {
        content.innerHTML=`<div class="section-head"><div><small>OFFICIAL DRAW RESULT</small><h2>Kesinleşen Gruplar</h2><p>Grup içi puan tablosu kullanılmaz. Tüm oyuncular Genel Puan ekranında birlikte sıralanır.</p></div><b>5–4–5</b></div><div class="group-grid">${Object.entries(GROUPS).map(([group,players])=>`<article class="group-card"><header><small>GROUP</small><strong>${group}</strong><b>${players.length} OYUNCU</b></header>${players.map((player,index)=>`<div><i>${index+1}</i><span>${esc(player)}</span></div>`).join("")}</article>`).join("")}</div>`;
      }
    }
    function renderFixture(fixture){
      const result={...defaultResult(),...(results[fixture.id]||{})},done=completed(fixture),open=openId===fixture.id;
      return `<article class="fixture ${done?"done":""}"><button class="fixture-row" data-open="${fixture.id}"><span class="meta">GRUP ${fixture.group}<small>${fixture.leg}. Devre · ${fixture.stars}</small></span><strong>${esc(fixture.home)}</strong><span class="score">${done?`<b>${result.homeScore}</b><i>–</i><b>${result.awayScore}</b>`:"<em>VS</em>"}</span><strong class="away">${esc(fixture.away)}</strong><span class="status">${done?"KAYDEDİLDİ ✓":"SONUÇ GİR →"}</span></button>${open?`<div class="result-editor"><label><b>${esc(fixture.home)}</b><input data-field="homeTeam" data-id="${fixture.id}" placeholder="Kullandığı takım" value="${esc(result.homeTeam)}"><input data-field="homeScore" data-id="${fixture.id}" class="score-input" type="number" min="0" inputmode="numeric" placeholder="0" value="${esc(result.homeScore)}"></label><span>—</span><label class="away-label"><b>${esc(fixture.away)}</b><input data-field="awayTeam" data-id="${fixture.id}" placeholder="Kullandığı takım" value="${esc(result.awayTeam)}"><input data-field="awayScore" data-id="${fixture.id}" class="score-input" type="number" min="0" inputmode="numeric" placeholder="0" value="${esc(result.awayScore)}"></label><footer><button class="clear" data-clear="${fixture.id}">TEMİZLE</button><button class="save" data-save="${fixture.id}" ${result.homeScore===""||result.awayScore===""?"disabled":""}>SONUCU KAYDET</button></footer></div>`:""}</article>`;
    }
    document.addEventListener("click",event=>{
      const button=event.target.closest("button"); if(!button)return;
      if(button.dataset.tab){activeTab=button.dataset.tab;openId=null;render()}
      else if(button.dataset.groupFilter){groupFilter=button.dataset.groupFilter;openId=null;render()}
      else if(button.dataset.legFilter!==undefined){legFilter=Number(button.dataset.legFilter);openId=null;render()}
      else if(button.dataset.open){openId=openId===button.dataset.open?null:button.dataset.open;render()}
      else if(button.dataset.save){openId=null;scheduleCloudSave();render()}
      else if(button.dataset.clear){delete results[button.dataset.clear];openId=null;scheduleCloudSave();render()}
    });
    document.addEventListener("input",event=>{
      const input=event.target.closest("input[data-field]");if(!input)return;
      results[input.dataset.id]={...defaultResult(),...(results[input.dataset.id]||{}),[input.dataset.field]:input.value};
      persistLocal();
      const save=document.querySelector(`[data-save="${input.dataset.id}"]`);
      if(save)save.disabled=results[input.dataset.id].homeScore===""||results[input.dataset.id].awayScore==="";
    });
    try{results=JSON.parse(localStorage.getItem(LOCAL_KEY)||"{}")}catch{results={}}
    render();
    if(window.FIFA_CLOUD?.init){
      window.FIFA_CLOUD.init({
        onState:(remote)=>{
          state=remote;
          const remoteData=remote?.[CLOUD_KEY];
          if(remoteData?.results){results=remoteData.results;persistLocal();render()}
        },
        onAuth:({isAdmin})=>{admin=Boolean(isAdmin);setCloud(admin?"Yönetici bağlantısı hazır · sonuçlar buluta kaydedilecek":"Görüntüleme modu · sonuç girişi için ana sitede yönetici oturumunu açın",admin?"ok":"warn")},
        onStatus:({status})=>{if(status==="error")setCloud("Bulut bağlantısı kurulamadı; cihaz kaydı aktif.","warn")}
      }).catch(()=>setCloud("Bulut bağlantısı kurulamadı; cihaz kaydı aktif.","warn"));
    } else setCloud("Bulut bağlantısı bulunamadı; cihaz kaydı aktif.","warn");
  })();
  </script>
</body>
</html>
