<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050b1d">
  <title>FIFA 10 · Broadcast & OBS</title>
  <style>
    :root{--blue:#54b6ff;--gold:#f0c95d;--green:#55dfa2;--red:#ff8198;--line:rgba(130,158,255,.28);--panel:rgba(5,12,31,.94)}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}
    button,select{font:inherit}.stage{position:fixed;inset:0;display:grid;align-items:end;padding:3.4vw}.scene{width:100%}.brand{display:flex;align-items:center;gap:14px;margin-bottom:12px;text-shadow:0 2px 18px #000}.brand i{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 18px var(--green)}.brand span{font-size:13px;font-weight:900;letter-spacing:.17em}.brand small{margin-left:auto;color:#aec1e5;font-weight:800}
    .panel{border:1px solid var(--line);border-radius:22px;background:linear-gradient(120deg,rgba(5,12,31,.98),rgba(21,20,65,.96));box-shadow:0 24px 80px rgba(0,0,0,.58);overflow:hidden}.panel>header{display:flex;justify-content:space-between;align-items:end;padding:20px 24px;border-bottom:1px solid var(--line);background:rgba(8,18,45,.9)}.panel>header span{color:var(--blue);font-size:10px;font-weight:900;letter-spacing:.16em}.panel h1{margin:5px 0 0;font-size:32px}.panel>header b{color:var(--gold);font-size:20px}
    .table-head,.table-row{display:grid;grid-template-columns:45px minmax(260px,1.7fr) 60px 70px 100px 105px 150px;align-items:center;gap:8px}.table-head{padding:11px 18px;color:#8297bd;font-size:10px;font-weight:900;letter-spacing:.08em}.table-row{min-height:43px;padding:7px 18px;border-top:1px solid rgba(130,158,255,.14);font-size:14px}.table-row.direct{background:linear-gradient(90deg,rgba(240,201,93,.10),transparent)}.table-row.eliminated{opacity:.72}.table-row>i{color:#8fa1c5;font-style:normal}.table-row strong{font-size:15px}.table-row span{text-align:center;color:#b9c7e1}.table-row b{text-align:right}.table-row em{color:var(--blue);font-size:10px;font-style:normal;font-weight:900}.table-row.direct em{color:var(--gold)}.table-row.eliminated em{color:var(--red)}
    .hero-result{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:35px;padding:40px}.hero-result article{text-align:center}.hero-result article span{color:#94a8cc;font-size:12px;font-weight:900;letter-spacing:.12em}.hero-result article h2{margin:8px 0;font-size:42px}.hero-result article strong{color:var(--gold);font-size:18px}.score{font-size:76px;font-weight:950;letter-spacing:.08em;text-shadow:0 0 28px rgba(240,201,93,.18)}.score small{color:var(--gold)}
    .up-next{padding:42px;text-align:center}.up-next>span{color:var(--blue);font-size:12px;font-weight:900;letter-spacing:.18em}.up-next h2{margin:14px 0;font-size:48px}.up-next h2 i{margin:0 20px;color:var(--gold);font-style:normal}.up-next strong{display:block;color:#a4b6d8;font-size:18px}.up-next small{display:block;margin-top:16px;color:var(--gold);font-size:14px}
    .qualification{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:18px}.qualification article{padding:18px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.035)}.qualification article>span{font-size:10px;font-weight:900;letter-spacing:.13em}.qualification article.direct>span{color:var(--gold)}.qualification article.playin>span{color:var(--blue)}.qualification article.eliminated>span{color:var(--red)}.qualification div{display:grid;gap:6px;margin-top:12px}.qualification b{display:flex;justify-content:space-between;padding:8px 10px;border-radius:8px;background:rgba(0,0,0,.19)}.qualification small{color:#9dafd1;font-weight:700}
    .lowerthird{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;padding:18px 22px}.lowerthird>i{width:11px;height:58px;border-radius:5px;background:linear-gradient(var(--blue),#9458ef)}.lowerthird span{color:var(--blue);font-size:10px;font-weight:900;letter-spacing:.15em}.lowerthird h2{margin:5px 0 0;font-size:27px}.lowerthird>b{color:var(--gold);font-size:24px}
    .empty{padding:55px;text-align:center;color:#9baece}.controls{position:fixed;top:12px;left:50%;z-index:4;display:none;gap:6px;transform:translateX(-50%);padding:7px;border:1px solid var(--line);border-radius:11px;background:#07122e}.controls.visible{display:flex}.controls button,.controls select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#0c1938;color:#fff;font-size:11px;font-weight:800}.status{position:fixed;right:18px;top:18px;color:#91a5ca;font-size:10px;text-shadow:0 1px 5px #000}
    @media(max-width:900px){.stage{padding:15px}.table-head,.table-row{grid-template-columns:30px minmax(150px,1fr) 38px 55px 70px}.table-head>:nth-child(5),.table-row>:nth-child(5){display:none}.table-head>:nth-child(6),.table-row>:nth-child(6){display:none}.table-row{font-size:11px}.table-row strong{font-size:11px}.hero-result{gap:12px;padding:22px}.hero-result article h2{font-size:25px}.score{font-size:42px}.up-next h2{font-size:30px}.qualification{grid-template-columns:1fr}.qualification article{padding:10px}.controls{max-width:95%;overflow:auto}}
  </style>
</head>
<body>
  <nav class="controls" id="controls" aria-label="Broadcast scene controls">
    <button data-mode="standings">Standings</button>
    <button data-mode="latest">Latest</button>
    <button data-mode="next">Next</button>
    <button data-mode="qualification">Qualification</button>
    <button data-mode="lowerthird">Lower Third</button>
    <select id="language"><option value="tr">TR</option><option value="en">EN</option></select>
  </nav>
  <main class="stage"><div class="scene" id="scene"></div></main>
  <div class="status" id="status">FIFA 10 · CONNECTING</div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="cloud-config.js?v=2.1.0"></script>
  <script src="cloud.js?v=2.1.0"></script>
  <script>
    (() => {
      "use strict";
      const STORAGE_KEY = "fifa-tournament-hub-v1";
      const params = new URL(location.href).searchParams;
      let mode = ["standings","latest","next","qualification","lowerthird"].includes(params.get("mode")) ? params.get("mode") : "standings";
      let language = params.get("lang") === "en" || localStorage.getItem("fifa9-ui-language") === "en" ? "en" : "tr";
      let state = null;
      const copy = (tr, en) => language === "en" ? en : tr;
      const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[char]));
      const draft = () => state?.seasonSystem?.fifa10Draft || {};
      const draw = () => draft().draw || null;
      const players = () => new Map((draw()?.participants || []).map(player => [String(player.id), player]));
      const completed = () => (draw()?.fixtures || []).filter(match => match.completed && Number.isFinite(Number(match.homeScore)) && Number.isFinite(Number(match.awayScore)));
      const compare = (a,b) => b.ppg-a.ppg || b.gdPerMatch-a.gdPerMatch || b.gf-a.gf || b.winRate-a.winRate || a.tieBreakOrder-b.tieBreakOrder;
      function standings(){
        const d=draw(); if(!d)return[];
        const groupMap=new Map(); ["A","B","C"].forEach(group=>(d.groups?.[group]||[]).forEach(id=>groupMap.set(id,group)));
        const table=new Map((d.participants||[]).map((player,index)=>[player.id,{id:player.id,name:player.name,group:groupMap.get(player.id)||"–",tieBreakOrder:Number(player.tieBreakOrder)||index+1,mp:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}]));
        completed().forEach(match=>{const home=table.get(match.homeId),away=table.get(match.awayId);if(!home||!away)return;const hs=Number(match.homeScore),as=Number(match.awayScore);home.mp++;away.mp++;home.gf+=hs;home.ga+=as;away.gf+=as;away.ga+=hs;if(hs>as){home.w++;away.l++;home.pts+=3}else if(hs<as){away.w++;home.l++;away.pts+=3}else{home.d++;away.d++;home.pts++;away.pts++}});
        return [...table.values()].map(row=>({...row,gd:row.gf-row.ga,ppg:row.mp?row.pts/row.mp:0,gdPerMatch:row.mp?(row.gf-row.ga)/row.mp:0,winRate:row.mp?row.w/row.mp:0})).sort(compare).map((row,index)=>({...row,rank:index+1}));
      }
      function pending(){
        const rows=(draw()?.fixtures||[]).filter(match=>!match.completed);
        const last=[...completed()].sort((a,b)=>Date.parse(b.updatedAt||"")-Date.parse(a.updatedAt||""))[0];
        const lastPlayers=new Set(last?[last.homeId,last.awayId]:[]);
        return rows.sort((a,b)=>(lastPlayers.has(a.homeId)||lastPlayers.has(a.awayId)?1:0)-(lastPlayers.has(b.homeId)||lastPlayers.has(b.awayId)?1:0)||a.leg-b.leg||a.group.localeCompare(b.group)||a.matchday-b.matchday);
      }
      const brand = label => `<div class="brand"><i></i><span>ORUÇ REİS FOOTBALL UNIVERSE · FIFA 10</span><small>${esc(label)}</small></div>`;
      function renderStandings(){
        const rows=standings();
        return `${brand(copy("CANLI GENEL PUAN","LIVE OVERALL TABLE"))}<section class="panel"><header><div><span>PPG · ${copy("AV/M","GD/M")}</span><h1>${copy("FIFA 10 Genel Sıralama","FIFA 10 Overall Standings")}</h1></div><b>${completed().length}/${draw()?.fixtures?.length||78}</b></header><div class="table-head"><span>#</span><span>${copy("OYUNCU","PLAYER")}</span><span>${copy("GRUP","GROUP")}</span><span>MP</span><span>GF</span><span>${copy("AV/M","GD/M")}</span><span>${copy("YOL","PATH")}</span></div>${rows.map(row=>{const path=row.rank<=4?"direct":row.rank<=12?"playin":"eliminated";const label=path==="direct"?copy("DOĞRUDAN QF","DIRECT QF"):path==="playin"?"PLAY-IN":copy("ELENDİ","ELIMINATED");return `<div class="table-row ${path}"><i>${row.rank}</i><strong>${esc(row.name)}</strong><span>${row.group}</span><span>${row.mp}</span><span>${row.gf}</span><b>${row.gdPerMatch>0?"+":""}${row.gdPerMatch.toFixed(3)} · ${row.ppg.toFixed(3)}</b><em>${label}</em></div>`}).join("")}</section>`;
      }
      function renderLatest(){
        const p=players();const match=[...completed()].sort((a,b)=>Date.parse(b.updatedAt||"")-Date.parse(a.updatedAt||"")||b.sequence-a.sequence)[0];
        if(!match)return `${brand(copy("SON SONUÇ","LATEST RESULT"))}<section class="panel empty">${copy("Henüz sonuç girilmedi.","No result has been entered yet.")}</section>`;
        return `${brand(copy("SON SONUÇ","LATEST RESULT"))}<section class="panel"><header><div><span>${copy("GRUP","GROUP")} ${match.group} · ${match.stars}★</span><h1>${copy("Resmî Maç Sonucu","Official Match Result")}</h1></div><b>MD ${match.matchday}</b></header><div class="hero-result"><article><span>${esc(match.homeTeam||copy("TAKIM BEKLENİYOR","TEAM PENDING"))}</span><h2>${esc(p.get(match.homeId)?.name||"–")}</h2></article><div class="score">${match.homeScore}<small>–</small>${match.awayScore}</div><article><span>${esc(match.awayTeam||copy("TAKIM BEKLENİYOR","TEAM PENDING"))}</span><h2>${esc(p.get(match.awayId)?.name||"–")}</h2></article></div></section>`;
      }
      function renderNext(){
        const p=players();const match=pending()[0];
        if(!match)return `${brand(copy("SIRADAKİ MAÇ","UP NEXT"))}<section class="panel empty">${copy("Grup aşaması tamamlandı.","The group stage is complete.")}</section>`;
        return `${brand(copy("SIRADAKİ MAÇ","UP NEXT"))}<section class="panel"><header><div><span>DYNAMIC TOURNAMENT SCHEDULE</span><h1>${copy("Sıradaki Resmî Maç","Next Official Match")}</h1></div><b>${match.stars}★</b></header><div class="up-next"><span>${copy("GRUP","GROUP")} ${match.group} · ${copy(`${match.leg}. DEVRE`,`CIRCUIT ${match.leg}`)} · MD ${match.matchday}</span><h2>${esc(p.get(match.homeId)?.name||"–")} <i>VS</i> ${esc(p.get(match.awayId)?.name||"–")}</h2><strong>${copy("Takımlar sonuç girişinde doğrulanır","Teams are validated at result entry")}</strong><small>PPG → ${copy("AV/M","GD/M")} → GF → ${copy("Galibiyet Oranı","Win Rate")} → ${copy("Kura Sırası","Draw Order")}</small></div></section>`;
      }
      function renderQualification(){
        const rows=standings();
        const block=(cls,label,list)=>`<article class="${cls}"><span>${label}</span><div>${list.map(row=>`<b><small>#${row.rank}</small>${esc(row.name)}</b>`).join("")}</div></article>`;
        return `${brand("MATHEMATICAL QUALIFICATION CENTRE")}<section class="panel"><header><div><span>1–4 · 5–12 · 13–14</span><h1>${copy("Qualification Yolları","Qualification Paths")}</h1></div><b>${completed().length}/${draw()?.fixtures?.length||78}</b></header><div class="qualification">${block("direct",copy("DOĞRUDAN ÇEYREK FİNAL","DIRECT QUARTER-FINAL"),rows.slice(0,4))}${block("playin","CHAMPIONSHIP PLAY-IN · BEST OF 3",rows.slice(4,12))}${block("eliminated",copy("DOĞRUDAN ELENENLER","ELIMINATED"),rows.slice(12,14))}</div></section>`;
      }
      function renderLowerThird(){
        const p=players();const match=pending()[0];const latest=[...completed()].sort((a,b)=>Date.parse(b.updatedAt||"")-Date.parse(a.updatedAt||""))[0];
        const text=match?`${esc(p.get(match.homeId)?.name||"–")} vs ${esc(p.get(match.awayId)?.name||"–")}`:latest?`${esc(p.get(latest.homeId)?.name||"–")} ${latest.homeScore}–${latest.awayScore} ${esc(p.get(latest.awayId)?.name||"–")}`:copy("FIFA 10 turnuvası","FIFA 10 tournament");
        return `${brand(copy("CANLI ALT BANT","LIVE LOWER THIRD"))}<section class="panel lowerthird"><i></i><div><span>${match?copy("SIRADAKİ MAÇ","UP NEXT"):copy("SON DURUM","LATEST")}</span><h2>${text}</h2></div><b>${match?`${match.stars}★ · ${copy("GRUP","GROUP")} ${match.group}`:`${completed().length}/${draw()?.fixtures?.length||78}`}</b></section>`;
      }
      function render(){
        document.documentElement.lang=language;
        const scene=document.getElementById("scene");
        if(!draw()){scene.innerHTML=`${brand("FIFA 10")}<section class="panel empty">${copy("Turnuva verisi bekleniyor…","Waiting for tournament data…")}</section>`;return}
        scene.innerHTML=mode==="latest"?renderLatest():mode==="next"?renderNext():mode==="qualification"?renderQualification():mode==="lowerthird"?renderLowerThird():renderStandings();
      }
      function readLocal(){try{const value=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");if(value&&typeof value==="object")state=value}catch(_){}}
      document.getElementById("language").value=language;
      document.getElementById("controls").classList.toggle("visible",params.get("controls")==="1");
      document.addEventListener("click",event=>{const button=event.target.closest("[data-mode]");if(!button)return;mode=button.dataset.mode;render()});
      document.getElementById("language").addEventListener("change",event=>{language=event.target.value;document.documentElement.lang=language;render()});
      readLocal();render();
      window.addEventListener("storage",()=>{readLocal();render()});
      if(window.FIFA_CLOUD?.init)window.FIFA_CLOUD.init({onState:payload=>{state=payload;document.getElementById("status").textContent="FIFA 10 · LIVE CLOUD";render()},onStatus:info=>{document.getElementById("status").textContent=`FIFA 10 · ${String(info.status||"LIVE").toUpperCase()}`}}).catch(()=>{});
      setInterval(()=>{readLocal();render()},15000);
    })();
  </script>
</body>
</html>
